name: 功能提案
description: 要什么 / 怎么用 / 验收标准 / 不做什么
labels: [feature]
body:
  - type: textarea
    id: goal
    attributes: {label: 要什么}
    validations: {required: true}
  - type: textarea
    id: usage
    attributes: {label: 怎么用}
  - type: textarea
    id: accept
    attributes: {label: 验收标准, description: 可判定的完成条件}
    validations: {required: true}
  - type: textarea
    id: not
    attributes: {label: 不做什么, description: 明确排除范围，避免 PR 越做越大}
